<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Ads Dawson portfolio case file.">
    <title>Portfolio Case File | Ads Dawson</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/cves.css">
    <link rel="stylesheet" href="css/content-viewer.css">
</head>
<body class="content-viewer">
    <header class="case-header">
        <nav class="case-nav" aria-label="Primary">
            <a class="back-link" href="index.html"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back to portfolio</a>
            <span class="brand-mark">ADS DAWSON <span>/</span> PORTFOLIO CASE FILE</span>
        </nav>
        <div class="case-header-content">
            <p id="viewer-eyebrow" class="eyebrow">Portfolio / case file</p>
            <h1 id="view-title">Loading case file</h1>
            <p id="view-subtitle" class="header-dek"></p>
            <div id="viewer-meta" class="header-meta" role="group" aria-label="Record summary"></div>
        </div>
    </header>

    <main class="case-main">
        <article id="content-entry" class="content-entry" aria-busy="true">
            <div class="content-entry-layout">
                <aside id="content-rail" class="content-rail" aria-label="Entry facts"></aside>
                <div id="content-body" class="content-article">
                    <div class="content-loading" role="status">
                        <i class="fas fa-spinner fa-spin" aria-hidden="true"></i>
                        <span>Loading case file…</span>
                    </div>
                </div>
            </div>
            <section id="files-list" class="resource-section" aria-labelledby="resources-heading" hidden>
                <h2 id="resources-heading">Sources &amp; resources</h2>
                <div id="files-container" class="resource-list"></div>
            </section>
        <noscript>
            <p class="empty-state">JavaScript is required to load this case file. Return to the <a href="index.html">main portfolio</a>.</p>
        </noscript>
        </article>
    </main>

    <footer class="case-footer">
        <a href="index.html">Ads Dawson</a>
        <span>Portfolio record · <span id="footer-year"></span></span>
    </footer>

    <script src="js/content-data.js"></script>
    <script src="js/viewer-markdown.js"></script>
    <script src="js/viewer.js"></script>
</body>
</html>
