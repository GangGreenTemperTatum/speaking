<!doctype html>
<!--
  Browser build of Chocolate Doom (shareware WAD), embedded by the portfolio homepage as an
  opt-in "arcade break" panel. Changes on top of the stock Emscripten shell:
    * the engine starts windowed (`-nofullscreen`), so it never takes over the screen on boot,
    * the canvas never captures the mouse pointer (the panel documents keyboard controls),
    * `F` and the engine's own Alt+Enter both run one opt-in fullscreen toggle the panel owns,
    * a lost, or uncreatable, WebGL context is reported to the panel instead of alerting,
    * the engine posts `doom-ready`, or `doom-error` when it aborts or cannot start, to the
      embedding page.
  Runtime artifacts and licensing: see NOTICE.txt.
-->
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Doom shareware — arcade break</title>
    <style>body {
  font-family: arial;
  margin: 0;
  padding: none;
}

.emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
div.emscripten { text-align: center; }
div.emscripten_border { border: 1px solid black; }
/* the canvas *must not* have any border or padding, or mouse coords will be wrong */
canvas.emscripten { border: 0px none; background-color: black; }

.spinner {
  height: 30px;
  width: 30px;
  margin: 0;
  margin-top: 20px;
  margin-left: 20px;
  display: inline-block;
  vertical-align: top;

  -webkit-animation: rotation .8s linear infinite;
  -moz-animation: rotation .8s linear infinite;
  -o-animation: rotation .8s linear infinite;
  animation: rotation 0.8s linear infinite;

  border-left: 5px solid rgb(235, 235, 235);
  border-right: 5px solid rgb(235, 235, 235);
  border-bottom: 5px solid rgb(235, 235, 235);
  border-top: 5px solid rgb(120, 120, 120);

  border-radius: 100%;
  background-color: rgb(189, 215, 46);
}

@-webkit-keyframes rotation {
  from {-webkit-transform: rotate(0deg);}
  to {-webkit-transform: rotate(360deg);}
}
@-moz-keyframes rotation {
  from {-moz-transform: rotate(0deg);}
  to {-moz-transform: rotate(360deg);}
}
@-o-keyframes rotation {
  from {-o-transform: rotate(0deg);}
  to {-o-transform: rotate(360deg);}
}
@keyframes rotation {
  from {transform: rotate(0deg);}
  to {transform: rotate(360deg);}
}

#status {
  display: inline-block;
  vertical-align: top;
  margin-top: 30px;
  margin-left: 20px;
  font-weight: bold;
  color: rgb(120, 120, 120);
}

#progress {
  height: 20px;
  width: 300px;
}

#output {
  width: 100%;
  height: 200px;
  margin: 0 auto;
  margin-top: 10px;
  border-left: 0px;
  border-right: 0px;
  padding-left: 0px;
  padding-right: 0px;
  display: block;
  background-color: black;
  color: white;
  font-family: 'Lucida Console', Monaco, monospace;
  outline: none;
}
</style>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0d0b0a;
      }
      #output, #progress, #spinner, #status {
        display: none !important;
      }
      .emscripten_border {
        width: 100%;
        height: 100%;
        border: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Emscripten re-sizes the canvas for fullscreen by writing inline width/height, which would
         overflow this fixed-aspect panel whenever the screen state is not the game's; the panel
         owns the layout instead and the bitmap is letterboxed into it. */
      canvas.emscripten {
        width: 100% !important;
        height: 100% !important;
        object-fit: contain;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div class="spinner" id='spinner'></div>
    <div class="emscripten" id="status">Downloading...</div>

    <div class="emscripten">
      <progress value="0" max="100" id="progress" hidden=1></progress>
    </div>

    <div class="emscripten_border">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    </div>
    <textarea id="output" rows="8"></textarea>

    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var spinnerElement = document.getElementById('spinner');
      var canvasElement = document.getElementById('canvas');
      var outputElement = document.getElementById('output');
      if (outputElement) outputElement.value = ''; // clear browser cache

      // The engine cannot survive a lost context (GPU reset, long-suspended tab), so surface it to
      // the panel, which offers a restart. An alert() here would block the whole portfolio page.
      // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
      canvasElement.addEventListener('webglcontextlost', (e) => {
        console.error('WebGL context lost.');
        e.preventDefault();
        notifyPanel('doom-error', 'context-lost');
      }, false);

      var Module = {
        print(...args) {
          console.log(...args);
          // These replacements are necessary if you render to raw HTML
          //text = text.replace(/&/g, "&amp;");
          //text = text.replace(/</g, "&lt;");
          //text = text.replace(/>/g, "&gt;");
          //text = text.replace('\n', '<br>', 'g');
          if (outputElement) {
            var text = args.join(' ');
            outputElement.value += text + "\n";
            outputElement.scrollTop = outputElement.scrollHeight; // focus on bottom
          }
        },
        canvas: canvasElement,
        setStatus(text) {
          if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          // if this is a progress update, skip it if too soon
          if (m && now - Module.setStatus.last.time < 30) return;
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2])*100;
            progressElement.max = parseInt(m[4])*100;
            progressElement.hidden = false;
            spinnerElement.hidden = false;
          } else {
            progressElement.value = null;
            progressElement.max = null;
            progressElement.hidden = true;
            if (!text) spinnerElement.style.display = 'none';
          }
          statusElement.innerHTML = text;
        },
        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };

      // Embedded as a panel: run windowed (the engine defaults to fullscreen, and Emscripten
      // defers that request until the next event, so it would fire on the visitor's first click)
      // and never capture the mouse pointer. `-nofullscreen` is load-bearing: it is what keeps the
      // deferred request out of the queue, and __tests__/e2e.spec.js fails if it is dropped.
      Module['arguments'] = ['-nofullscreen'];
      canvasElement.requestPointerLock = () => Promise.resolve();

      // Keeps the embedding panel in step with the engine (see docs/index.html).
      const notifyPanel = (type, reason) => {
        try {
          if (window.parent !== window) window.parent.postMessage({ type, reason }, location.origin);
        } catch (error) {
          console.warn('Doom could not notify the embedding page', error);
        }
      };
      Module['onRuntimeInitialized'] = () => notifyPanel('doom-ready');
      Module['onAbort'] = () => notifyPanel('doom-error');
      Module['onExit'] = code => {
        if (code !== 0) notifyPanel('doom-error');
      };
      // A machine that cannot create a WebGL context never reaches abort(), so say so directly
      // instead of leaving the panel as a black box.
      canvasElement.addEventListener('webglcontextcreationerror', event => {
        console.error('WebGL context creation failed: ' + event.statusMessage);
        notifyPanel('doom-error', 'webgl');
      }, false);

      Module.setStatus('Downloading...');
      window.onerror = (event) => {
        // TODO: do not warn on ok events like simulating an infinite loop or exitStatus
        Module.setStatus('Exception thrown, see JavaScript console');
        spinnerElement.style.display = 'none';
        Module.setStatus = (text) => {
          if (text) console.error('[post-exception status] ' + text);
        };
      };
    </script>
    <script async type="text/javascript" src="chocolate-doom.js"></script>
    <script>
      window.render_game_to_text = () => JSON.stringify({
        mode: window.Module?.calledRun ? 'running' : 'loading',
        canvas: { width: document.getElementById('canvas')?.width || 0, height: document.getElementById('canvas')?.height || 0 },
        controls: 'Arrow keys move/turn; Ctrl fires; Space uses; Shift runs; F toggles fullscreen'
      });
      window.advanceTime = (milliseconds) => new Promise(resolve => setTimeout(resolve, milliseconds));

      // Fullscreen belongs to the panel: the documented F key and the engine's own binding
      // (Alt+Enter) both run this toggle, so the game can never take the screen - or re-size the
      // canvas for it - behind the embedding page's back.
      function toggleFullscreen() {
        if (!window.Module?.requestFullscreen) return;
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else {
          window.Module.requestFullscreen(false, true);
        }
      }

      document.addEventListener('keydown', event => {
        // Alt+Enter is the engine's own fullscreen binding: swallow every form of it, including
        // key auto-repeat, which would otherwise leak through to the engine.
        if (event.altKey && event.key === 'Enter') {
          event.preventDefault();
          event.stopImmediatePropagation();
          if (!event.repeat) toggleFullscreen();
          return;
        }
        if (event.repeat || event.key.toLowerCase() !== 'f') return;
        event.preventDefault();
        toggleFullscreen();
      }, true);
    </script>
  </body>
</html>
