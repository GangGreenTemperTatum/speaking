name: Update PR Description with Rigging

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  update-description:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for proper diffing

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Generate PR Description
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          uv run --no-project .github/scripts/rigging_pr_decorator.py "origin/${{ github.base_ref }}" > rigging_description.md

      - name: Update PR Description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## AI-Generated Summary"
            echo
            cat rigging_description.md
            echo
            echo "---"
            echo
            echo "This summary was generated with ❤️ by [rigging](https://rigging.dreadnode.io/)"
          } > pr_body.md
          gh pr edit "$PR_NUMBER" --body-file pr_body.md
