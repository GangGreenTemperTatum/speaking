name: secret-scan
# Server-side secret scanning with TruffleHog. This covers what local pre-commit
# cannot: direct pushes, and pull requests from forks whose authors never ran the hook.
# It reads code only, holds no secrets of its own, and fails the run on a verified secret.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the history to scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # TruffleHog needs full history to diff the range
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # v3.100.1
        with:
          # The action already passes --fail; adding it again makes the TruffleHog
          # CLI error out ("flag 'fail' cannot be repeated"). Only extra scan options
          # belong here. --results=verified means only a verified secret fails the
          # build, not a stray high-entropy string.
          extra_args: --results=verified
